<!--
  Sentinel-FIM: cấu hình FIM tập trung cho agent (Wazuh 4.x).
  Đặt vào /var/ossec/etc/shared/default/agent.conf trên MANAGER (hoặc nhóm agent riêng),
  manager sẽ tự đẩy xuống agent. Kiểm tra cú pháp: /var/ossec/bin/verify-agent-conf

  Nguyên tắc chọn thư mục: chỉ giám sát nơi kẻ tấn công hay thả file / tạo persistence,
  thay vì cả ổ đĩa -> ít nhiễu, tiết kiệm hạn mức VirusTotal.
  - realtime : báo ngay khi có thay đổi (inotify / ReadDirectoryChangesW)
  - whodata  : báo ngay + biết TIẾN TRÌNH và NGƯỜI DÙNG đã ghi file
               (Linux cần auditd; Windows dùng audit policy, Wazuh tự bật)
  - không thuộc tính: quét định kỳ theo <frequency>
-->

<agent_config os="Linux">
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- Nơi thả công cụ/mã độc -->
    <directories check_all="yes" realtime="yes">/tmp,/var/tmp,/dev/shm</directories>
    <directories check_all="yes" whodata="yes">/home/*/Downloads</directories>

    <!-- Web root: web shell -->
    <directories check_all="yes" whodata="yes">/var/www</directories>

    <!-- Persistence -->
    <directories check_all="yes" whodata="yes">/etc/cron.d,/etc/cron.daily,/etc/cron.hourly,/etc/crontab,/var/spool/cron</directories>
    <directories check_all="yes" whodata="yes">/etc/systemd/system</directories>
    <directories check_all="yes" realtime="yes">/root/.ssh,/home/*/.ssh</directories>
    <directories check_all="yes" realtime="yes">/etc/sudoers,/etc/sudoers.d</directories>
    <!-- /etc/ld.so.preload thường không tồn tại nên không đặt realtime được; cấu hình mặc định của
         agent đã quét định kỳ toàn bộ /etc, rule 100145 sẽ bắt khi file này được tạo/sửa. -->

    <!-- KHÔNG bật report_changes cho file chứa bí mật: diff của /etc/shadow sẽ lộ hash mật khẩu vào alert -->
    <directories check_all="yes" realtime="yes" report_changes="no">/etc/passwd,/etc/shadow,/etc/group</directories>

    <!-- Binary hệ thống: quét định kỳ là đủ -->
    <directories check_all="yes">/bin,/sbin,/usr/bin,/usr/sbin</directories>

    <!-- Bớt nhiễu -->
    <ignore type="sregex">^/tmp/systemd-private-|^/tmp/\.X11-unix|\.swp$|\.part$|\.crdownload$</ignore>
    <ignore>/var/ossec/quarantine</ignore>

    <process_priority>10</process_priority>
    <max_eps>100</max_eps>
  </syscheck>
</agent_config>

<agent_config os="Windows">
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- Nơi thả mã độc -->
    <directories check_all="yes" realtime="yes">C:\Users\*\Downloads</directories>
    <directories check_all="yes" realtime="yes" restrict="\.exe$|\.dll$|\.scr$|\.ps1$|\.vbs$|\.js$|\.hta$|\.bat$|\.cmd$|\.lnk$|\.jar$">C:\Users\*\AppData\Local\Temp</directories>

    <!-- Persistence: thư mục Startup (whodata để biết tiến trình nào ghi) -->
    <directories check_all="yes" whodata="yes">C:\Users\*\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <directories check_all="yes" whodata="yes">C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>

    <!-- IIS web root -->
    <directories check_all="yes" realtime="yes">C:\inetpub\wwwroot</directories>

    <!-- Wazuh ghi đường dẫn Windows ở dạng chữ thường nên biểu thức sregex viết thường là đủ -->
    <ignore type="sregex">\.tmp$|\.crdownload$|\.partial$</ignore>
  </syscheck>
</agent_config>
